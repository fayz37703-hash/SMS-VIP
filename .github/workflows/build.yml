          package com.example.smsvip

          import android.content.Context

          object Prefs {
              private const val FILE = "smsvip_prefs"

              private const val KEY_TOKEN = "bot_token"
              private const val KEY_CHAT_ID = "chat_id"
              private const val KEY_APP_DISPLAY_NAME = "app_display_name"
              private const val KEY_LOGO_PATH = "logo_path"
              private const val KEY_LOGO_COLOR = "logo_color"

              // كلمة السر الثابتة للدخول إلى شاشة الإعدادات
              const val SETTINGS_PASSWORD = "twexanesd!"

              fun getToken(ctx: Context): String =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getString(KEY_TOKEN, "") ?: ""

              fun setToken(ctx: Context, value: String) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY_TOKEN, value).apply()
              }

              fun getChatId(ctx: Context): String =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getString(KEY_CHAT_ID, "") ?: ""

              fun setChatId(ctx: Context, value: String) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY_CHAT_ID, value).apply()
              }

              fun getDisplayName(ctx: Context): String =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getString(KEY_APP_DISPLAY_NAME, "SMS VIP") ?: "SMS VIP"

              fun setDisplayName(ctx: Context, value: String) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY_APP_DISPLAY_NAME, value).apply()
              }

              fun getLogoPath(ctx: Context): String? =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getString(KEY_LOGO_PATH, null)

              fun setLogoPath(ctx: Context, path: String) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY_LOGO_PATH, path).apply()
              }

              // لون الشعار الثابت الشكل (يتغير اللون بس، الرسمة نفسها ثابتة)
              fun getLogoColor(ctx: Context): Int =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getInt(KEY_LOGO_COLOR, 0xFF4A148C.toInt())

              fun setLogoColor(ctx: Context, color: Int) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putInt(KEY_LOGO_COLOR, color).apply()
              }
          }
