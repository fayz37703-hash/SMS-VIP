          cat > 'app/src/main/java/com/example/smsvip/MainActivity.kt' << 'EOF_INNER'
          package com.example.smsvip

          import android.Manifest
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.PorterDuff
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private val handler = Handler(Looper.getMainLooper())
              private var longPressTriggered = false

              private val longPressRunnable = Runnable {
                  longPressTriggered = true
                  askPasswordAndOpenSettings()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val imgGear = findViewById<android.widget.ImageView>(R.id.imgGear)
                  val imgLogo = findViewById<android.widget.ImageView>(R.id.imgLogo)
                  val txtAppName = findViewById<TextView>(R.id.txtAppName)
                  val txtStatus = findViewById<TextView>(R.id.txtStatus)
                  val btnStart = findViewById<android.widget.Button>(R.id.btnStart)

                  // تحديث الاسم واللون المحفوظين
                  txtAppName.text = Prefs.getDisplayName(this)
                  imgLogo.setColorFilter(Prefs.getLogoColor(this), PorterDuff.Mode.SRC_ATOP)

                  // الضغط المطوّل 5 ثواني على الترس لفتح الإعدادات
                  imgGear.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              longPressTriggered = false
                              handler.postDelayed(longPressRunnable, 5000)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longPressRunnable)
                          }
                      }
                      true
                  }

                  btnStart.setOnClickListener {
                      requestPermissionsIfNeeded()
                      startForwardService()
                      txtStatus.text = "الخدمة شغالة الآن"
                  }

                  requestPermissionsIfNeeded()
              }

              private fun askPasswordAndOpenSettings() {
                  val input = EditText(this)
                  input.transformationMethod = android.text.method.PasswordTransformationMethod.getInstance()

                  AlertDialog.Builder(this)
                      .setTitle("كلمة السر")
                      .setView(input)
                      .setPositiveButton("دخول") { _, _ ->
                          if (input.text.toString() == Prefs.SETTINGS_PASSWORD) {
                              startActivity(Intent(this, SettingsActivity::class.java))
                          } else {
                              android.widget.Toast.makeText(this, "كلمة سر غلط", android.widget.Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun requestPermissionsIfNeeded() {
                  val perms = mutableListOf(
                      Manifest.permission.RECEIVE_SMS,
                      Manifest.permission.READ_SMS
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 100)
                  }
              }

              private fun startForwardService() {
                  val intent = Intent(this, ForwardService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  findViewById<TextView>(R.id.txtAppName).text = Prefs.getDisplayName(this)
                  findViewById<android.widget.ImageView>(R.id.imgLogo)
                      .setColorFilter(Prefs.getLogoColor(this), PorterDuff.Mode.SRC_ATOP)
              }
          }
          EOF_INNER
