          class SettingsActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)

                  val imgLogoPreview = findViewById<ImageView>(R.id.imgLogoPreview)
                  val editAppName = findViewById<EditText>(R.id.editAppName)
                  val editToken = findViewById<EditText>(R.id.editToken)
                  val editChatId = findViewById<EditText>(R.id.editChatId)
                  val btnSave = findViewById<Button>(R.id.btnSave)

                  // تحميل القيم المحفوظة حالياً
                  editAppName.setText(Prefs.getDisplayName(this))
                  editToken.setText(Prefs.getToken(this))
                  editChatId.setText(Prefs.getChatId(this))
                  imgLogoPreview.setColorFilter(Prefs.getLogoColor(this), PorterDuff.Mode.SRC_ATOP)

                  val colorButtons = mapOf(
                      R.id.btnColorPurple to 0xFF4A148C.toInt(),
                      R.id.btnColorGold to 0xFFD6A020.toInt(),
                      R.id.btnColorGreen to 0xFF1B5E20.toInt(),
                      R.id.btnColorBlue to 0xFF0D47A1.toInt(),
                      R.id.btnColorRed to 0xFFB71C1C.toInt()
                  )

                  for ((id, color) in colorButtons) {
                      findViewById<Button>(id).setOnClickListener {
                          Prefs.setLogoColor(this, color)
                          imgLogoPreview.setColorFilter(color, PorterDuff.Mode.SRC_ATOP)
                      }
                  }

                  btnSave.setOnClickListener {
                      val name = editAppName.text.toString().ifBlank { "SMS VIP" }
                      Prefs.setDisplayName(this, name)
                      Prefs.setToken(this, editToken.text.toString().trim())
                      Prefs.setChatId(this, editChatId.text.toString().trim())
                      Toast.makeText(this, "تم الحفظ", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }
          }
          EOF_INNER

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-VIP-apk
          path: app/build/outputs/apk/debug/app-debug.apk
