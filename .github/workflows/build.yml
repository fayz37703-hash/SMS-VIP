          package com.example.smsvip

          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object TelegramSender {

              // يرسل رسالة نصية إلى بوت تيليجرام، ويرجع true لو نجح الإرسال
              fun send(token: String, chatId: String, text: String): Boolean {
                  if (token.isBlank() || chatId.isBlank()) return false
                  return try {
                      val encodedText = URLEncoder.encode(text, "UTF-8")
                      val encodedChat = URLEncoder.encode(chatId, "UTF-8")
                      val urlStr = "https://api.telegram.org/bot$token/sendMessage?chat_id=$encodedChat&text=$encodedText"
                      val url = URL(urlStr)
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 15000
                      val code = conn.responseCode
                      conn.disconnect()
                      code in 200..299
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF_INNER

