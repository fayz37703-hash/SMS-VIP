name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate project files
        run: |
          mkdir -p .
          cat > 'build.gradle.kts' << 'EOF_INNER'
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF_INNER

          mkdir -p .
          cat > 'settings.gradle.kts' << 'EOF_INNER'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SMS VIP"
          include(":app")
          EOF_INNER

          mkdir -p .
          cat > 'gradle.properties' << 'EOF_INNER'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_INNER

          mkdir -p app
          cat > 'app/build.gradle.kts' << 'EOF_INNER'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smsvip"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smsvip"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF_INNER
          mkdir -p app/src/main
          cat > 'app/src/main/AndroidManifest.xml' << 'EOF_INNER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.SmsVip">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false" />

                  <service
                      android:name=".ForwardService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF_INNER

          mkdir -p app/src/main/res/values
          cat > 'app/src/main/res/values/strings.xml' << 'EOF_INNER'
          <resources>
              <string name="app_name">SMS VIP</string>
          </resources>
          EOF_INNER

          mkdir -p app/src/main/res/values
          cat > 'app/src/main/res/values/colors.xml' << 'EOF_INNER'
          <resources>
              <color name="purple_700">#4A148C</color>
              <color name="gold">#D6A020</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF_INNER

          mkdir -p app/src/main/res/values
          cat > 'app/src/main/res/values/themes.xml' << 'EOF_INNER'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.SmsVip" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/purple_700</item>
                  <item name="colorPrimaryVariant">@color/purple_700</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/gold</item>
              </style>
          </resources>
          EOF_INNER

          mkdir -p app/src/main/res/values
          cat > 'app/src/main/res/values/ic_launcher_background.xml' << 'EOF_INNER'
          <resources>
              <color name="ic_launcher_background">#4A148C</color>
          </resources>
          EOF_INNER

          mkdir -p app/src/main/res/drawable
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' << 'EOF_INNER'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#D6A020"
                  android:pathData="M24,38 h60 a10,10 0 0 1 10,10 v22 a10,10 0 0 1 -10,10 h-40 l-14,14 v-14 h-6 a10,10 0 0 1 -10,-10 v-22 a10,10 0 0 1 10,-10 z" />
              <path
                  android:fillColor="#4A148C"
                  android:pathData="M38,52 h32 v6 h-32 z M38,64 h20 v6 h-20 z" />
          </vector>
          EOF_INNER

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' << 'EOF_INNER'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_INNER

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml' << 'EOF_INNER'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_INNER

          mkdir -p app/src/main/res/xml
          cat > 'app/src/main/res/xml/backup_rules.xml' << 'EOF_INNER'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
          </full-backup-content>
          EOF_INNER
          
